[project]
name = "kobe"
version = "0.1.0"
description = "KOBE — Keeping Order & Being Efficient. Desk-based voice AI assistant."
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.6",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "typer>=0.12",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "soundfile>=0.12",
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
    "elevenlabs>=1.10",
    "openai>=1.54",
    "keyboard>=0.13.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psutil>=6.1",
    "pygetwindow>=0.0.9",
    "websockets>=13",
    "paho-mqtt>=2.1",
    "spotipy>=2.24",
    "pycaw>=20240210",
    "comtypes>=1.4",
    "mss>=9.0",
    "pillow>=10.4",
    # Phase 6 — MuteMe Mini physical button via cython-hidapi. Prebuilt cp311
    # Windows wheels; no driver install needed (generic HID).
    "hidapi>=0.14",
]

[project.optional-dependencies]
# Phase 5 (gesture control) needs MediaPipe + a webcam. Install via
# `uv sync --extra gestures`. Keep it optional so headless / cv2-incompatible
# environments can still install KOBE without a wheel for `mediapipe`.
# `mediapipe` already pulls in `opencv-contrib-python` which provides `cv2`
# — do NOT add `opencv-python` separately, both ship the same package and
# would clobber each other.
gestures = [
    "mediapipe>=0.10.21,<0.11",
]

# Phase 7 (holographic fan content pipeline). Pillow is already a base dep
# (Phase 4 vision uses it), so we only need the video + 3D stack here.
# imageio-ffmpeg ships a static ffmpeg binary so the user doesn't need one
# on PATH. Install via `uv sync --extra hologram`.
hologram = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "trimesh>=4.4",
    "pyglet>=2.0 ; platform_system == 'Windows'",
]

[project.scripts]
kobe = "kobe.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kobe"]

[tool.ruff]
line-length = 100
target-version = "py311"
