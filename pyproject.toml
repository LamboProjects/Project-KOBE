[project]
name = "kobe"
version = "0.1.0"
description = "KOBE — Keeping Order & Being Efficient. Desk-based voice AI assistant."
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.6",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "typer>=0.12",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "soundfile>=0.12",
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
    "elevenlabs>=1.10",
    "openai>=1.54",
    "keyboard>=0.13.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psutil>=6.1",
    "pygetwindow>=0.0.9",
    "websockets>=13",
    "paho-mqtt>=2.1",
    "spotipy>=2.24",
    "pycaw>=20240210",
    "comtypes>=1.4",
    "mss>=9.0",
    "pillow>=10.4",
]

[project.scripts]
kobe = "kobe.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kobe"]

[tool.ruff]
line-length = 100
target-version = "py311"
