<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOBE // HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Decorative HUD frame overlays -->
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Connection indicator -->
  <div class="conn-indicator" id="conn-indicator" data-status="connecting">
    <span class="conn-dot"></span>
    <span class="conn-label" id="conn-label">CONNECTING</span>
  </div>

  <main class="hud-grid">
    <!-- Top-left brand -->
    <header class="panel brand-panel">
      <div class="brand-mark">
        <span class="brand-glyph">◢◤</span>
        <span class="brand-name">KOBE</span>
        <span class="brand-sub">// PROJECT HUD · PHASE 2</span>
      </div>
      <div class="brand-meta">
        <span class="tag">v0.2</span>
        <span class="tag">WS</span>
      </div>
    </header>

    <!-- Top-right clock -->
    <header class="panel clock-panel">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date">---- -- ---</div>
      <div class="clock-tz" id="clock-tz">LOCAL</div>
    </header>

    <!-- Center state indicator -->
    <section class="panel state-panel" id="state-panel" data-state="idle">
      <div class="state-corners">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
      </div>

      <div class="state-orb" id="state-orb">
        <!-- listening: concentric pulse rings -->
        <div class="anim-listening">
          <span class="ring r1"></span>
          <span class="ring r2"></span>
          <span class="ring r3"></span>
          <span class="core"></span>
        </div>
        <!-- thinking: rotating arc spinner -->
        <div class="anim-thinking">
          <span class="arc arc-a"></span>
          <span class="arc arc-b"></span>
          <span class="arc arc-c"></span>
        </div>
        <!-- speaking: waveform bars -->
        <div class="anim-speaking">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <!-- idle: static dim core -->
        <div class="anim-idle">
          <span class="idle-core"></span>
          <span class="idle-ring"></span>
        </div>
        <!-- muted: red X -->
        <div class="anim-muted">
          <span class="mute-x"></span>
        </div>
      </div>

      <div class="state-label" id="state-label">KOBE · IDLE</div>
      <div class="state-sub" id="state-sub">awaiting wake word</div>
    </section>

    <!-- Transcript (left/bottom) -->
    <section class="panel transcript-panel">
      <div class="panel-header">
        <span class="panel-title">TRANSCRIPT</span>
        <span class="panel-meta" id="transcript-count">0 / 8</span>
      </div>
      <ul class="transcript-list" id="transcript-list">
        <li class="placeholder">— NO SIGNAL —</li>
      </ul>
    </section>

    <!-- Response panel (right) -->
    <section class="panel response-panel">
      <div class="panel-header">
        <span class="panel-title">RESPONSE</span>
        <span class="panel-meta" id="response-meta">—</span>
      </div>
      <div class="response-body" id="response-body">
        <div class="response-placeholder">— NO RESPONSE YET —</div>
      </div>
    </section>

    <!-- System widget (bottom-right) -->
    <section class="panel system-panel">
      <div class="panel-header">
        <span class="panel-title">SYSTEM</span>
        <span class="panel-meta" id="system-fg">—</span>
      </div>
      <div class="system-body">
        <div class="meter">
          <div class="meter-row">
            <span class="meter-label">CPU</span>
            <span class="meter-value" id="cpu-value">—</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill" id="cpu-fill" style="width: 0%"></div>
          </div>
        </div>
        <div class="meter">
          <div class="meter-row">
            <span class="meter-label">MEM</span>
            <span class="meter-value" id="mem-value">—</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill" id="mem-fill" style="width: 0%"></div>
          </div>
        </div>
        <div class="sys-extra">
          <span class="sys-k">FG</span>
          <span class="sys-v" id="system-fg-full">—</span>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
